title: Castar
tagline: Engineering notes from Castar
description: >-
  Engineering notes from the Castar team on building an actor–casting
  matching platform: how casting calls become search conditions, how we
  handle appearance, and the decisions behind them.
url: "https://xoxown31.github.io"
baseurl: "/castar-landing"
lang: en
timezone: Asia/Seoul
author:
  name: Castar Team

# jekyll-seo-tag
logo: /assets/img/castar-mark.svg

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

permalink: /blog/:year/:month/:title/

# Only GitHub Pages–whitelisted plugins. The Atom feeds are plain Liquid
# templates (feed.xml, ko/feed.xml) so each language gets its own feed.
plugins:
  - jekyll-seo-tag

# Bilingual without plugins: every page and post carries `lang` (en | ko) and,
# when it has a counterpart in the other language, a shared `translation_key`.
# Korean posts live in _posts/ko/ (drafts in _drafts/ko/) and are served under /ko/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Castar Team
      lang: en
      locale: en_US
  - scope:
      path: "_posts/ko"
      type: posts
    values:
      lang: ko
      locale: ko_KR
      author: Castar 팀
      permalink: /ko/blog/:year/:month/:title/
  - scope:
      path: "_drafts/ko"
    values:
      lang: ko
      locale: ko_KR
      author: Castar 팀
      permalink: /ko/blog/:year/:month/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      lang: en
      locale: en_US
  - scope:
      path: "ko"
      type: pages
    values:
      lang: ko
      locale: ko_KR

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
